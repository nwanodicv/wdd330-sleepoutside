<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/form-base.css" />
    <link rel="stylesheet" href="../css/form-large.css" />

    <script src="../js/checkout.mjs" type="module"></script>
  </head>

  <body>
    <header class="divider">
      <div class="logo">
        <img src="images/noun_Tent_2517.svg" alt="tent image for logo" />

        <a href="index.html">
          Sleep
          <span class="highlight">Outside</span>
        </a>
      </div>

      <div class="cart">
        <a aria-label="cart link" href="cart/" title="View cart">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <!-- ...existing SVG paths.... -->
          </svg>
        </a>
      </div>
    </header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
        <form method="GET" action="../success/index.html" id="checkoutForm">
          <aside>
            <fieldset>
              <legend>Contact & Shipping</legend>

              <label for="firstName">First Name
                <input name="firstName" id="firstName" type="text" autocomplete="given-name" title="Your First Name" required>
              </label>

              <label for="lastName">Last Name
                <input name="lastName" id="lastName" type="text" autocomplete="family-name" title="Your Last Name" required>
              </label>

              <label for="street">Street
                <input name="street" id="street" type="text" autocomplete="street-address" title="Include numbers, letters, hyphens, and spaces only" required pattern="[A-Za-z0-9\-\s]{7,}" placeholder="Street Address">
              </label>

              <label for="city">City
                <input name="city" id="city" type="text" autocomplete="address-level2" title="Include hyphens and spaces only" required pattern="[A-Za-z\-\s]{2,}" placeholder="Ogwashi-uku">
              </label>

              <label for="email">Email
                <input name="email" id="email" type="email" autocomplete="email" title="Your Email" required placeholder="james@gmail.com">
              </label>

              <label for="phone">Phone
                <input name="phone" id="phone" type="tel" autocomplete="tel" title="Your Phone Number" required pattern="^\+?[0-9\-\s]{7,}$" placeholder="+234-807-339-0964">
              </label>

              <label for="timestamp">Timestamp
                <input name="timestamp" id="timestamp" type="date" autocomplete="off" required>
              </label>
            </fieldset>
          </aside>

          <fieldset class="second-fieldset-group">
            <legend>Payment</legend>

            <label for="card-number">Card Number
              <input name="cardNumber" id="card-number" type="text" inputmode="numeric" autocomplete="cc-number" title="Enter your card number" required pattern="[0-9\s\-]{13,19}" placeholder="1234 5678 9012 3456">
            </label>

            <label for="expiration">Expiration Date (MM/YY)
              <input name="expiration" id="expiration" type="text" inputmode="numeric" autocomplete="cc-exp" title="Enter expiration as MM/YY" required pattern="^(0[1-9]|1[0-2])\/\d{2}$" placeholder="04/29">
            </label>

            <label for="code">Security Code (CVC)
              <input name="code" id="code" type="password" inputmode="numeric" autocomplete="cc-csc" title="Enter your card CVC" required pattern="^\d{3,4}$" placeholder="353">
            </label>
          </fieldset>

          <label class="term-condition">
            <h2>Terms & Conditions</h2>
            <input type="checkbox" required>
            (I have read and agreed with the privacy policies)
          </label>

          <input id="checkoutSubmit" type="submit" value="Proceed to Payment">
        </form>
      </section>
    </main>

    <footer>&copy; NOT a real business</footer>
  </body>
</html>
